name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          # Online intake relay (see /new-patients/intake/). Both unset = the
          # patient downloads the PDF instead of it being sent to the office.
          NEXT_PUBLIC_INTAKE_ENDPOINT: ${{ vars.NEXT_PUBLIC_INTAKE_ENDPOINT }}
          NEXT_PUBLIC_INTAKE_TOKEN: ${{ vars.NEXT_PUBLIC_INTAKE_TOKEN }}
          # Served at the domain root (hcng.net, set as the Pages custom domain).
          # To preview on the project page again, add back:
          # NEXT_PUBLIC_BASE_PATH: "/hcng-overhaul"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
